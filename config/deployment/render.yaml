services:
  # Backend API Service
  - type: web
    name: ytconverter-api
    env: python
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg && rm -rf /var/lib/apt/lists/*
      pip install -r requirements.txt
    startCommand: chmod +x start_render.sh && ./start_render.sh
    envVars:
      - key: PORT
        sync: false
      - key: FLASK_ENV
        value: production
      - key: TASK_TIMEOUT
        value: 1800
      - key: CLEANUP_INTERVAL
        value: 3600
      - key: LOG_LEVEL
        value: INFO
      # Opzionale: aggiungi COOKIES_BASE64 se hai i cookie
      # - key: COOKIES_BASE64
      #   value: <your-base64-encoded-cookies>
  
