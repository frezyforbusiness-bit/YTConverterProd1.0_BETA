<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="note" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded frame -->
  <rect x="4" y="4" width="56" height="56" rx="18" ry="18" fill="url(#bg)"/>
  <rect x="7" y="7" width="50" height="50" rx="16" ry="16" fill="#0f0f10" />

  <!-- Circular “vinyl” disc -->
  <circle cx="32" cy="30" r="16" fill="#141418"/>
  <circle cx="32" cy="30" r="11.5" fill="#0b0b0d" stroke="#26262b" stroke-width="1.4"/>
  <circle cx="32" cy="30" r="2.2" fill="#9a9a9a"/>

  <!-- Subtle grooves -->
  <circle cx="32" cy="30" r="7.5" fill="none" stroke="#1f1f24" stroke-width="1"/>

  <!-- Music note over the disc -->
  <path
    d="M40 16v13.8c0 3.8-3 6.9-6.9 6.9-2.8 0-5.1-1.7-5.1-4s2.3-3.9 5.1-3.9c0.9 0 1.8.2 2.5.5V18.4L40 17z"
    fill="url(#note)"
  />
  <circle cx="28.5" cy="32.8" r="3.9" fill="#bfbfbf"/>

  <!-- Bottom waveform -->
  <g transform="translate(13,42)">
    <rect x="0"  y="4" width="3" height="6" rx="1.5" fill="#4ade80"/>
    <rect x="5"  y="1" width="3" height="9" rx="1.5" fill="#60a5fa"/>
    <rect x="10" y="3" width="3" height="7" rx="1.5" fill="#4ade80"/>
    <rect x="15" y="0" width="3" height="10" rx="1.5" fill="#60a5fa"/>
    <rect x="20" y="2" width="3" height="8" rx="1.5" fill="#4ade80"/>
    <rect x="25" y="1" width="3" height="9" rx="1.5" fill="#60a5fa"/>
    <rect x="30" y="3" width="3" height="7" rx="1.5" fill="#4ade80"/>
  </g>
</svg>


