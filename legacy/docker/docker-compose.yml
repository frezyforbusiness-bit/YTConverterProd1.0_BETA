version: '3.8'

services:
  # Backend Flask API
  backend:
    build:
      context: .
      dockerfile: config/docker/Dockerfile
    container_name: ytconverter-backend
    expose:
      - "5000"
    environment:
      - PORT=5000
      - FLASK_ENV=${FLASK_ENV:-production}
      - TASK_TIMEOUT=${TASK_TIMEOUT:-1800}
      - CLEANUP_INTERVAL=${CLEANUP_INTERVAL:-3600}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - COOKIES_BASE64=${COOKIES_BASE64:-}
      - COOKIES_FILE=${COOKIES_FILE:-}
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount temp directory for persistence
      - ./temp:/app/temp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ytconverter-network

  # Frontend Nginx
  frontend:
    image: nginx:alpine
    container_name: ytconverter-frontend
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ytconverter-network

networks:
  ytconverter-network:
    driver: bridge
